name: Daten sammeln und Website veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # jeden Montag früh: Daten aktualisieren
  workflow_dispatch:
    inputs:
      eras:
        description: "Nur bestimmte Epochen (z. B. W,B,featured), leer = alle"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Daten aus Wikipedia und Wikidata sammeln
        if: ${{ !contains(github.event.head_commit.message, '[nur-website]') }}
        env:
          ERAS: ${{ github.event.inputs.eras }}
        run: node scripts/build-data.mjs

      - name: Daten im Repository speichern
        run: |
          git config user.name "Arsenal Atlas Datensammler"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Keine Änderungen an den Daten."
          else
            git commit -m "Daten aktualisiert [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
